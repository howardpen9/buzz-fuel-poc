[package]
name = "buzz-fuel-bot"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Buzz Fuel P0 adapter — exact /fuel → MakeReel fuel intent → signed status messages"

[dependencies]
anyhow = "1"
futures-util = "0.3"
nostr = { version = "0.44", features = ["nip44", "nip98"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
buzz-sdk = { path = "../buzz/crates/buzz-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
